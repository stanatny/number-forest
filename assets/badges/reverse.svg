<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="nf-reverse-title nf-reverse-desc">
  <title id="nf-reverse-title">森林徽章 · 金色松果背面</title>
  <desc id="nf-reverse-desc">深青蓝珐琅中镶嵌一枚金色松果纹章，四周环绕森林刻纹与金色星芒，外圈保留金属桂叶和底部奖星。</desc>
