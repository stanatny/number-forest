    <linearGradient id="nf-reverse-shine" x1="89" y1="52" x2="220" y2="238" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF9DF"/><stop offset="1" stop-color="#E7C576"/></linearGradient>
