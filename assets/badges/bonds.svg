<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="nf-bonds-title nf-bonds-desc">
  <title id="nf-bonds-title">松果小屋 · 合在一起的徽章</title>
